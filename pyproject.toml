[project]
name = "makernight-shop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
]

[tool.uv]
# The backend is a Django project run from backend/, not an installable package
package = false

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Without this, ruff also formats the code in Markdown files, such as the local notes
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S", "T20", "DJ"]
# Django and DRF configure views, admins and serializers with mutable class attributes
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["backend"]
mypy_path = "backend"
explicit_package_bases = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
django_find_project = false
pythonpath = ["backend"]
testpaths = ["backend/tests"]
