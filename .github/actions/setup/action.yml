name: setup
description: Installs just and the dependencies of the backend, the frontend or both
inputs:
  backend:
    description: Install uv and the Python dependencies, and migrate the database
    default: "false"
  frontend:
    description: Install Node.js and the Node dependencies
    default: "false"
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v4
    # setup-uv only publishes full versions, without a moving tag such as v10
    - if: inputs.backend == 'true'
      uses: astral-sh/setup-uv@v10.3.3
    - if: inputs.backend == 'true'
      shell: bash
      run: just setup-backend
    - if: inputs.frontend == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - if: inputs.frontend == 'true'
      shell: bash
      run: just setup-frontend
